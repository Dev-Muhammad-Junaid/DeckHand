name: DeckHand
options:
  bundleIdPrefix: com.widgetsflow
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  Loom:
    path: ../
  # Crash and performance reporting (see Shared/DeckHandDiagnostics.swift).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.34.0
  # Mac self-updates (Developer ID download, not the Mac App Store).
  # See Release/RELEASING.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

settings:
  base:
    SWIFT_VERSION: 6.0
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # Sentry organization slug for the dSYM upload step. Not a secret; the
    # auth token lives in ~/.sentryclirc on the build Mac (`sentry-cli login`),
    # never in this repository.
    SENTRY_ORG: widgetsflow

configs:
  Debug: debug
  Release: release

targets:

  # ─────────────────────────────────────────────────────────────
  # macOS Host
  # ─────────────────────────────────────────────────────────────
  DeckHandMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeckHandMac
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
      - package: Sentry
        product: Sentry
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetsflow.pixelhand.mac
        # Sparkle appcast and EdDSA public key, read by Info.plist. The key
        # is the base64 string `generate_keys` prints; empty = updates refuse
        # to install (Release/RELEASING.md §1.3).
        SPARKLE_FEED_URL: https://pixelhand.pages.dev/mac/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: ""
        # Sentry project "pixelhand-mac". Paste its DSN here (Sentry → Project
        # Settings → Client Keys (DSN)). DSNs are designed to ship inside the
        # app, so committing it is fine. Empty = crash reporting off.
        SENTRY_DSN: ""
        SENTRY_PROJECT: pixelhand-mac
        # The dSYM upload script needs network and ~/.sentryclirc.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: DeckHandMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeckHandMac/DeckHandMac.entitlements
        PRODUCT_NAME: Pixel Hand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Brand cobalt for system controls; matches DeckHandTheme.accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        # Required for CGEvent mouse injection
        ENABLE_HARDENED_RUNTIME: YES
        # The entitlements this target ships need a real profile, so ad-hoc
        # ("-") signing cannot satisfy the build.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DD5AWPLT2V
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
    postBuildScripts:
      - name: Upload dSYMs to Sentry
        basedOnDependencyAnalysis: false
        script: |
          # Release builds only. Missing tools or credentials warn, never fail.
          [ "$CONFIGURATION" = "Release" ] || exit 0
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "warning: sentry-cli not installed (brew install getsentry/tools/sentry-cli); dSYMs not uploaded"
            exit 0
          fi
          if [ -z "$SENTRY_DSN" ]; then
            echo "note: SENTRY_DSN is empty; skipping dSYM upload"
            exit 0
          fi
          sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$DWARF_DSYM_FOLDER_PATH" \
            || echo "warning: Sentry dSYM upload failed; crashes from this build won't be symbolicated"
    scheme: {}

  # ─────────────────────────────────────────────────────────────
  # iOS / iPadOS Client
  # ─────────────────────────────────────────────────────────────
  DeckHandiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: DeckHandiOS
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetsflow.pixelhand
        # Sentry project "pixelhand-ios". Paste its DSN here (Sentry → Project
        # Settings → Client Keys (DSN)). Empty = crash reporting off.
        SENTRY_DSN: ""
        SENTRY_PROJECT: pixelhand-ios
        # The dSYM upload script needs network and ~/.sentryclirc.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: DeckHandiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeckHandiOS/DeckHandiOS.entitlements
        PRODUCT_NAME: Pixel Hand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Brand cobalt for system controls; matches DeckHandTheme.accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: 6.0
        # Needed to run on a real iPad; simulator builds sign ad-hoc and
        # never exercised this.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DD5AWPLT2V
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
    postBuildScripts:
      - name: Upload dSYMs to Sentry
        basedOnDependencyAnalysis: false
        script: |
          # Release builds only. Missing tools or credentials warn, never fail.
          [ "$CONFIGURATION" = "Release" ] || exit 0
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v sentry-cli >/dev/null 2>&1; then
            echo "warning: sentry-cli not installed (brew install getsentry/tools/sentry-cli); dSYMs not uploaded"
            exit 0
          fi
          if [ -z "$SENTRY_DSN" ]; then
            echo "note: SENTRY_DSN is empty; skipping dSYM upload"
            exit 0
          fi
          sentry-cli debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" "$DWARF_DSYM_FOLDER_PATH" \
            || echo "warning: Sentry dSYM upload failed; crashes from this build won't be symbolicated"
    scheme: {}

  # ─────────────────────────────────────────────────────────────
  # Wire-format contract tests (WID-400)
  # Compiles Shared/ directly so the tests exercise the exact
  # sources both apps ship, without needing a host app.
  # ─────────────────────────────────────────────────────────────
  DeckHandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DeckHandTests
        type: group
      - path: Shared
        type: group
    dependencies:
      - package: Loom
        product: LoomKit
      # Shared/DeckHandDiagnostics.swift imports it. No DSN here, so the
      # tests never report anything.
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.widgetsflow.pixelhand.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: 6.0
        # Without this the bundle has no Info.plist and code signing refuses
        # to run, so the suite never gets a chance to execute.
        GENERATE_INFOPLIST_FILE: YES
