name: CI

# Runs on pull requests only (not again after merging) to stay inside the
# GitHub Free macOS minute allowance (macOS minutes count 10x).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 15
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build all targets
        run: swift build

      - name: Run tests
        # invalidResumeOffsetIsRejected and liveSamePeerConnectionOutsideWindowIsDropped
        # hang rather than fail — pre-existing, unrelated to Deck Hand (see README).
        # Skipping them keeps CI inside the job timeout.
        run: |
          swift test --scratch-path .build-local \
            --skip invalidResumeOffsetIsRejected \
            --skip liveSamePeerConnectionOutsideWindowIsDropped
