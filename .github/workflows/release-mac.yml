name: Release Mac app

# Manual only. Never runs on push or pull requests: macOS runner minutes count
# 10x against the GitHub Free allowance, and a release takes ~20–40 minutes,
# most of it waiting for Apple's notary service.
#
# Runs the same scripts as a release on the owner's Mac
# (DeckHand/Scripts/release/release.sh, then publish.sh), with credentials
# from repository secrets instead of the login keychain. The secrets are
# listed in DeckHand/Release/RELEASING.md §4.
#
# It does not commit anything. The updated appcast.xml and _redirects come
# back as a build artifact; commit them to deploy the website.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Sparkle channel"
        type: choice
        options: [stable, beta]
        default: stable
      publish:
        description: "Upload the DMG to R2 (needs the Cloudflare secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install tools
        # create-dmg needs a Finder session to lay out the window, which a
        # runner doesn't have; make-dmg.sh falls back to plain hdiutil.
        run: brew install xcodegen

      - name: Set up a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (RELEASING.md §4)"; exit 1; }
          done

          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          P12="$RUNNER_TEMP/signing.p12"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          ASC_KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$ASC_KEY"
          chmod 600 "$ASC_KEY"

          # Same profile name the scripts use locally, stored in this keychain.
          xcrun notarytool store-credentials pixelhand-notary \
            --key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN"

          {
            echo "NOTARY_KEYCHAIN=$KEYCHAIN"
            echo "APP_STORE_CONNECT_KEY_PATH=$ASC_KEY"
            echo "APP_STORE_CONNECT_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build, notarize and sign the update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::Missing secret SPARKLE_ED_PRIVATE_KEY"; exit 1; }
          ./DeckHand/Scripts/release/release.sh

      - name: Upload the DMG to R2
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./DeckHand/Scripts/release/publish.sh

      - name: Keep the release files
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pixelhand-mac-release
          if-no-files-found: error
          retention-days: 14
          path: |
            DeckHand/build/release/*/*.dmg
            DeckHand/build/release/*/sparkle-signature.txt
            website/public/mac/appcast.xml
            website/public/_redirects

      - name: Remove the keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
